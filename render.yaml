services:
  - type: web
    name: skill-recommendation-backend
    runtime: python
    repo: https://github.com/TJGokul/skill-recommendation-system
    plan: free
    branch: main
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn skill_recommendation.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: skill_recommendation.settings
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skill-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: skill-db
    databaseName: skill_recommendation_db
    user: postgres
    plan: free
